services:
  postgres:
    image: postgres:16
    container_name: sgcapi-postgres
    restart: always
    environment:
      POSTGRES_DB: postgres-sgcapi-db
      POSTGRES_USER: sgcapi_user
      POSTGRES_PASSWORD: conccessionariaapi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: sgcapi-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: